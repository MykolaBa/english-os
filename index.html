<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131628" />
    <meta name="description" content="EnglishOS — personal English learning platform" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..500&family=Onest:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>EnglishOS</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        const saved = JSON.parse(localStorage.getItem('englishos:settings') || '{}')
        if (saved.state && saved.state.theme)
          document.documentElement.dataset.theme = saved.state.theme
        if (saved.state && saved.state.uiLanguage)
          document.documentElement.lang = saved.state.uiLanguage
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
